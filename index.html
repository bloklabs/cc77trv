<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe6" />
    <meta name="description" content="OS3 Concierge — private family research for travel, dining, culture, and daily life." />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OS3 Concierge" />
    <meta name="application-name" content="OS3 Concierge" />
    <title>OS3 Concierge</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">🌸 <span>OS3 Concierge</span><b id="xrayBadge" class="xray-badge" hidden>X-RAY</b></div>
        <div class="topbar-actions">
          <button id="geoBtn" class="chip icon" title="Nearby alerts (within 100m)">🔕</button>
          <button id="spaceBtn" class="chip" title="Shared space">🪢 <span id="spaceLabel">Solo</span></button>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav class="tabbar" role="tablist">
        <button class="tab is-active" data-tab="list" role="tab">📋<span>List</span></button>
        <button class="tab" data-tab="map" role="tab">🗺️<span>Map</span></button>
        <button class="tab" data-tab="plan" role="tab">🧠<span>Plan</span></button>
        <button class="tab" data-tab="voice" role="tab">🗣️<span>Voice</span></button>
      </nav>

      <button id="fab" class="fab" aria-label="Add a place">＋</button>
    </div>

    <!-- Add / edit sheet -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-card" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div id="sheetBody"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
