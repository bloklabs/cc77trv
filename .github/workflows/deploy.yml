name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test, lint & build
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE: /${{ github.event.repository.name }}/
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Prepare job-private scratch
        run: |
          mkdir -p "$RUNNER_TEMP/concierge"
          printf 'TMPDIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/concierge" "$RUNNER_TEMP/concierge/browsers" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
